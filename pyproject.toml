[project]
name = "lingdb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "tinydb==3.15.2",
]

[project.scripts]
lingdb = "lingdb.main:main"
data = "lingdb.data.main:main"
gen = "lingdb.gen.main:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
